<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>萬象心鏡</title>
<style>
/* ============ 共用 ============ */
* { margin:0; padding:0; box-sizing:border-box; }
body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:2rem; font-family:"Microsoft JhengHei","PingFang TC",serif; color:#e8e0ff;
  background: radial-gradient(circle at 50% 25%, #1a1438 0%, #0d0a1a 70%); transition: background 1s; }
.stars { position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image: radial-gradient(1px 1px at 20% 30%,#fff7,transparent),
    radial-gradient(1px 1px at 70% 15%,#fff5,transparent),
    radial-gradient(2px 2px at 40% 60%,#fff4,transparent),
    radial-gradient(1px 1px at 85% 70%,#fff5,transparent),
    radial-gradient(1px 1px at 10% 80%,#fff4,transparent),
    radial-gradient(2px 2px at 55% 85%,#fff3,transparent),
    radial-gradient(1px 1px at 30% 45%,#fff6,transparent); }
.vignette { position:fixed; inset:0; pointer-events:none; z-index:0;
  background: radial-gradient(circle at center, transparent 45%, #000a 100%); }
header { text-align:center; margin-bottom:2rem; z-index:1; }
.title { font-size:1.15rem; letter-spacing:.35em; color:#9b8cff; text-shadow:0 0 12px #9b8cff88; }
.sub { margin-top:.6rem; font-size:.72rem; color:#6f6394; letter-spacing:.1em; }
.note { margin-top:2rem; z-index:1; font-size:.64rem; color:#5c5a80; letter-spacing:.1em; text-align:center;
  border-top:1px dashed #3a2f66; padding-top:1rem; max-width:560px; line-height:1.8; }
.stage { z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; }
.hidden { display:none !important; }

/* 模式色調切換 */
body.mode-gua    { background: radial-gradient(circle at 50% 20%, #1a2a24 0%, #0a120e 70%); }
body.mode-tarot  { background: radial-gradient(circle at 50% 25%, #1a1438 0%, #0d0a1a 70%); }
body.mode-yuan   { background: radial-gradient(circle at 50% 25%, #12204a 0%, #070d20 70%); }
body.mode-chart  { background: radial-gradient(circle at 50% 25%, #141a2e 0%, #080c16 70%); }
body.mode-fengshui { background: radial-gradient(circle at 50% 25%, #241a10 0%, #0f0a06 70%); }
body.mode-star   { background: radial-gradient(circle at 50% 25%, #241430 0%, #0f0812 70%); }
body.mode-dream  { background: radial-gradient(circle at 50% 25%, #0f2430 0%, #060e12 70%); }

/* ============ 塔羅：翻牌 ============ */
.scene { display:flex; gap:2.4rem; flex-wrap:wrap; justify-content:center; perspective:1200px; }
.card { width:200px; cursor:pointer; }
.inner { position:relative; width:200px; height:350px; transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.25,.7,.2,1); }
.card.flipped .inner { transform:rotateY(180deg); }
.face { position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; overflow:hidden; }
.back { border:3px solid #4a3f88; background:repeating-linear-gradient(45deg,#2a2350 0 7px,#241d45 7px 14px);
  display:flex; align-items:center; justify-content:center; box-shadow:0 0 22px #4a3f8844; }
.back::after { content:"✦"; font-size:2.2rem; color:#a694ff; text-shadow:0 0 14px #a694ffcc;
  background:#241d45; width:54px; height:54px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  border:2px solid #4a3f88; }
.front { transform:rotateY(180deg); background:#171236; border:3px solid #4a3f88;
  box-shadow:inset 0 0 40px #000a; }
.card-img { width:100%; height:100%; object-fit:contain; display:block; }
.phase-label { position:absolute; bottom:0; left:0; right:0; text-align:center; padding:.4rem 0;
  font-size:.72rem; letter-spacing:.3em; color:#fff; background:linear-gradient(transparent,#000c); }
.card.flipped .front { box-shadow:0 0 30px #9b8cff66, inset 0 0 40px #000a; }
.card-label { margin-top:.9rem; font-size:.62rem; color:#8f7fd0; letter-spacing:.3em; text-align:center; }
.card-desc { margin-top:.5rem; font-size:.68rem; color:#b3a6e6; line-height:1.7; text-align:center;
  max-width:220px; opacity:0; transition:opacity .8s; }
.card.flipped .card-desc { opacity:1; }

/* ============ 卦：六爻生成 ============ */
.gua-card { background:linear-gradient(160deg,#16221c,#0e1712); border:1px solid #3a4a3f;
  border-radius:16px; padding:2rem 2.6rem; box-shadow:0 0 30px #3a4a3f33; }
.yao-list { display:flex; flex-direction:column; align-items:center; gap:.8rem; }
.yao { display:flex; align-items:center; justify-content:center; gap:1.2rem; opacity:0;
  animation:yaoIn .8s ease forwards; }
.yao-label { font-size:.68rem; color:#7c8a80; letter-spacing:.15em; width:3.2rem; text-align:right; }
.yao-mark { font-size:.62rem; color:#b8a86a; width:3.2rem; }
.yao-line { display:flex; gap:.5rem; }
.yao-line span { display:block; height:11px; border-radius:2px; }
.yao-line .solid { width:64px; background:#d8d0b0; box-shadow:0 0 6px #d8d0b055; }
.yao-line .split { width:30px; background:#d8d0b0; box-shadow:0 0 6px #d8d0b055; }
.yao.change .yao-line span { background:#b8a86a; box-shadow:0 0 8px #b8a86a88; }
.yao.desc-line { opacity:0; animation:descIn .9s ease forwards; font-size:.7rem; color:#8fa093;
  letter-spacing:.1em; text-align:center; max-width:420px; line-height:1.7; }
@keyframes yaoIn { from{opacity:0;transform:translateY(-14px);} to{opacity:1;transform:none;} }
@keyframes descIn { from{opacity:0;} to{opacity:1;} }
.gua-name { margin-top:1.6rem; text-align:center; opacity:0; animation:nameIn 1.2s ease forwards; }
.gua-trigram { font-size:1.4rem; color:#b8a86a; letter-spacing:.2em; }
.gua-title { font-size:2rem; margin:.4rem 0; color:#fff; letter-spacing:.3em; text-shadow:0 0 16px #ffffff33; }
.gua-mean { font-size:.73rem; color:#8fa093; letter-spacing:.12em; line-height:1.9; max-width:480px; margin:0 auto; }
@keyframes nameIn { from{opacity:0;transform:scale(.92);} to{opacity:1;transform:none;} }

/* ============ 緣：星空字卡 ============ */
.yuan-text { font-size:2rem; letter-spacing:.15em; color:#e8e0ff; text-align:center; max-width:640px;
  line-height:2; opacity:0; animation:yuanIn 2s ease forwards; text-shadow:0 0 24px #9b8cff88; }
.yuan-source { margin-top:1.2rem; font-size:.72rem; color:#6f6394; letter-spacing:.2em; opacity:0;
  animation:descIn 1.5s ease forwards; animation-delay:1.6s; }
@keyframes yuanIn { 0%{opacity:0;transform:scale(.96);filter:blur(6px);} 100%{opacity:1;transform:none;filter:none;} }

/* ============ 星盤：行星軌道 ============ */
.chart-wrap { position:relative; width:480px; height:480px; }
.chart-ring { position:absolute; inset:0; border-radius:50%; border:1px solid #3a4a7f;
  box-shadow:0 0 30px #3a4a7f33, inset 0 0 30px #0008; }
.chart-ring.r1 { inset:30px; opacity:.5; } .chart-ring.r2 { inset:60px; opacity:.3; }
.chart-ring.r3 { inset:90px; opacity:.2; } .chart-ring.r4 { inset:120px; opacity:.15; }
.chart-center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:90px; height:90px;
  border-radius:50%; background:radial-gradient(circle,#ffd9a0,#b8742c); box-shadow:0 0 40px #ffd9a066;
  display:flex; align-items:center; justify-content:center; font-size:.7rem; color:#3a1e00; font-weight:bold; }
.planet { position:absolute; width:26px; height:26px; margin:-13px; border-radius:50%; opacity:0;
  animation:planetIn 1s ease forwards; }
.planet::after { content:attr(data-name); position:absolute; top:-1.2rem; left:50%; transform:translateX(-50%);
  font-size:.6rem; color:#b3a6e6; letter-spacing:.1em; white-space:nowrap; }
.planet.hl { box-shadow:0 0 18px currentColor; }
.planet-ring { position:absolute; border:1px dashed currentColor; border-radius:50%; opacity:.25; }
@keyframes planetIn { from{opacity:0;transform:scale(.3);} to{opacity:1;transform:scale(1);} }
.chart-summary { margin-top:1.4rem; max-width:560px; text-align:center; font-size:.73rem; color:#b3a6e6;
  line-height:1.9; opacity:0; animation:descIn 1.2s ease forwards; letter-spacing:.08em; }

/* ============ 風水：五行氣流 ============ */
.fs-stage { position:relative; width:400px; height:400px; }
.fs-card { position:absolute; inset:0; border:1px solid #8a6a3a; border-radius:16px; background:#1a120a;
  box-shadow:0 0 30px #8a6a3a33; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.fs-element { font-size:3rem; color:#ffd9a0; text-shadow:0 0 30px #ffd9a066; z-index:1; }
.fs-glow { position:absolute; width:220px; height:220px; border-radius:50%; filter:blur(40px); opacity:.35; }
.fs-text { position:absolute; bottom:0; left:0; right:0; text-align:center; padding:1rem;
  background:linear-gradient(transparent,#000b); font-size:.78rem; color:#d8c8a8; line-height:1.8; letter-spacing:.08em; }
.fs-flow { position:absolute; width:3px; height:70px; background:linear-gradient(transparent,currentColor,transparent);
  border-radius:2px; opacity:0; animation:flowUp 3.5s ease-in infinite; }
@keyframes flowUp { 0%{transform:translateY(60px);opacity:0;} 30%{opacity:.5;} 100%{transform:translateY(-70px);opacity:0;} }
@keyframes pulseGlow { 0%,100%{transform:scale(1);opacity:.3;} 50%{transform:scale(1.2);opacity:.5;} }

/* ============ 星：原型圖騰 ============ */
.arc-ring { position:relative; width:460px; height:460px; }
.arc-item { position:absolute; width:70px; height:70px; margin:-35px; border-radius:50%;
  border:1px solid #6a3a8a; background:#160d1c; display:flex; align-items:center; justify-content:center;
  font-size:1.6rem; opacity:.25; transition:opacity .8s, transform .8s, box-shadow .8s; }
.arc-item.active { opacity:1; border-color:#d8a0ff; box-shadow:0 0 24px #d8a0ff66; transform:scale(1.25); }
.arc-item.inactive { opacity:.18; }
.arc-center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:180px; }
.arc-center .sym { font-size:3rem; color:#d8a0ff; text-shadow:0 0 30px #d8a0ff88; }
.arc-center .name { margin-top:.4rem; font-size:1.1rem; letter-spacing:.2em; color:#fff; }
.arc-center .desc { margin-top:.5rem; font-size:.68rem; color:#b3a6e6; line-height:1.7; }

/* ============ 夢：漸層碎片 ============ */
.dream-stage { position:relative; width:480px; height:340px; border-radius:20px; overflow:hidden;
  border:1px solid #3a6a7f; }
.dream-gradient { position:absolute; inset:0; background:linear-gradient(135deg,#0f2430,#1a3a4a,#0f2a38);
  animation:dreamShift 12s ease-in-out infinite; }
@keyframes dreamShift { 0%,100%{filter:hue-rotate(0deg);} 50%{filter:hue-rotate(30deg);} }
.dream-frag { position:absolute; font-size:1.4rem; opacity:0; animation:fragFloat 6s ease-in-out infinite;
  text-shadow:0 0 12px currentColor; }
@keyframes fragFloat { 0%{opacity:0;transform:translateY(20px) rotate(-8deg);}
  40%{opacity:.7;} 100%{opacity:0;transform:translateY(-30px) rotate(8deg);} }
.dream-mood { margin-top:1.4rem; text-align:center; font-size:.9rem; color:#8fc4d8; letter-spacing:.2em;
  opacity:0; animation:descIn 1.5s ease forwards; }
.dream-note { margin-top:.8rem; max-width:520px; text-align:center; font-size:.7rem; color:#6f8a94;
  line-height:1.8; letter-spacing:.08em; opacity:0; animation:descIn 1.5s ease forwards; animation-delay:.6s; }
</style>
</head>
<body class="mode-tarot" id="body">
<div class="stars"></div>
<div class="vignette"></div>
<header>
  <div class="title" id="title">✦ 萬象心鏡 ✦</div>
  <div class="sub" id="sub"></div>
</header>
<div class="stage" id="stage"></div>
<div class="note" id="note"></div>

<script>
/* 由生成器注入：window.MODE 與 window.DATA */
const MODE = "__MODE__";
const DATA = __DATA__;

const TITLES = {
  tarot:"✦ 萬象心鏡 · 塔羅牌陣 ✦", gua:"✦ 萬象心鏡 · 易象映射 ✦",
  yuan:"✦ 萬象心鏡 · 宇宙短訊 ✦", chart:"✦ 萬象心鏡 · 星象敘事 ✦",
  fengshui:"✦ 萬象心鏡 · 環境感應 ✦", star:"✦ 萬象心鏡 · 原型故事 ✦",
  dream:"✦ 萬象心鏡 · 夢境回音 ✦"
};
document.getElementById('body').className = 'mode-' + MODE;
document.getElementById('title').textContent = TITLES[MODE] || TITLES.tarot;
document.getElementById('sub').textContent = DATA.source || "";
const stage = document.getElementById('stage');

const R = {
  /* ---------------- 塔羅 ---------------- */
  tarot() {
    document.getElementById('note').textContent =
      "「此啟示源於塔羅象徵系統，僅作心境映照，非命定預言」";
    stage.innerHTML = '<div class="scene" id="scene"></div>';
    const scene = document.getElementById('scene');
    DATA.cards.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="inner">
          <div class="face back"></div>
          <div class="face front"><img class="card-img" src="${c.img}" alt="${c.en||''}">
            <div class="phase-label">${c.phase}${c.en?' · '+c.en:''}</div></div>
        </div>
        <div class="card-label">${c.en||c.phase}</div>
        <div class="card-desc">${c.desc||''}${c.tip?'<br><span style="color:#8f7fd0">— '+c.tip+' —</span>':''}</div>`;
      scene.appendChild(card);
      card.querySelector('.inner').addEventListener('click', () => card.classList.add('flipped'));
    });
    const cards = document.querySelectorAll('.card');
    (DATA.delays||[400,1500,2700]).forEach((t,i)=>setTimeout(()=>cards[i]?.classList.add('flipped'),t));
    if (DATA.verdict) setTimeout(()=>{
      const v=document.createElement('div');
      v.className='note'; v.style.marginTop='1.6rem'; v.style.color='#9b8cff'; v.style.border='none';
      v.innerHTML='<b>一句牌意總結</b>：'+DATA.verdict;
      stage.appendChild(v);
    }, (DATA.delays?DATA.delays[2]:2700)+1000);
  },

  /* ---------------- 卦 ---------------- */
  gua() {
    document.getElementById('note').textContent =
      "「此象源於《易經》『觀象玩辭』之法。此僅為當下心境之鏡像，非命運預測」";
    stage.innerHTML = `<div class="gua-card"><div class="yao-list" id="yaoList"></div>
      <div class="gua-name"><div class="gua-trigram">${DATA.trigram||''}</div>
      <div class="gua-title">${DATA.name||'卦'}</div>
      <div class="gua-mean">${DATA.mean||''}</div></div></div>`;
    const list = document.getElementById('yaoList');
    DATA.yao.forEach((y, i) => {
      const el = document.createElement('div');
      el.className='yao'+(y.change?' change':'');
      el.style.animationDelay=(i*0.8)+'s';
      el.innerHTML=`<div class="yao-label">${y.label}</div>
        <div class="yao-line">${y.yin?'<span class="split"></span><span class="split"></span>':'<span class="solid"></span>'}</div>
        <div class="yao-mark">${y.mark||''}</div>`;
      list.appendChild(el);
      if (y.desc) { const d=document.createElement('div');
        d.className='yao desc-line'; d.style.animationDelay=(i*0.8+0.5)+'s';
        d.textContent=y.desc; list.appendChild(d); }
    });
  },

  /* ---------------- 緣 ---------------- */
  yuan() {
    document.getElementById('note').textContent =
      "「源於道家與禪宗。宇宙即時短訊，僅作心境之鏡」";
    stage.innerHTML = `<div class="yuan-text">${DATA.text||''}</div>
      <div class="yuan-source">${DATA.source||''}</div>`;
  },

  /* ---------------- 星盤 ---------------- */
  chart() {
    document.getElementById('note').textContent =
      "「此星象敘事源於占星學『行星原型』，僅作當下課題之鏡」";
    stage.innerHTML = `<div class="chart-wrap" id="chart"></div>
      <div class="chart-summary" id="chartSum"></div>`;
    const wrap=document.getElementById('chart');
    wrap.innerHTML='<div class="chart-ring r1"></div><div class="chart-ring r2"></div>'+
      '<div class="chart-ring r3"></div><div class="chart-ring r4"></div>'+
      '<div class="chart-center">核心<br>自我</div>';
    DATA.planets.forEach((p,i)=>{
      const size=100-p.ring*20;
      const rad=(p.deg-90)*Math.PI/180;
      const x=50+ (size/100*45)*Math.cos(rad);
      const y=50+ (size/100*45)*Math.sin(rad);
      const pl=document.createElement('div');
      pl.className='planet'+(p.hl?' hl':'');
      pl.style.left=x+'%'; pl.style.top=y+'%';
      pl.style.background=p.color||'#b3a6e6';
      pl.style.color=p.color||'#b3a6e6';
      pl.style.animationDelay=(i*0.3)+'s';
      pl.setAttribute('data-name', p.name);
      pl.title=p.meaning||'';
      pl.innerHTML=p.sym||p.name[0];
      wrap.appendChild(pl);
    });
    setTimeout(()=>{
      document.getElementById('chartSum').textContent=DATA.summary||'';
    }, DATA.planets.length*300+500);
  },

  /* ---------------- 風水 ---------------- */
  fengshui() {
    document.getElementById('note').textContent =
      "「此風水感應源於『氣感』傳統，重在空間與心之共鳴，非吉凶制式」";
    stage.innerHTML = `<div class="fs-stage"><div class="fs-card">
        <div class="fs-glow" style="background:${DATA.glow||'#ffd9a0'}"></div>
        <div class="fs-element">${DATA.element||''}</div>
        <div class="fs-text">${DATA.text||''}</div></div></div>`;
    const g=stage.querySelector('.fs-glow');
    g.style.animation='pulseGlow 5s ease-in-out infinite';
    for(let i=0;i<14;i++){
      const f=document.createElement('div');
      f.className='fs-flow';
      f.style.color=DATA.glow||'#ffd9a0';
      f.style.left=(8+Math.random()*84)+'%';
      f.style.animationDelay=(Math.random()*3.5)+'s';
      f.style.animationDuration=(2.5+Math.random()*2)+'s';
      stage.querySelector('.fs-card').appendChild(f);
    }
  },

  /* ---------------- 星：原型 ---------------- */
  star() {
    document.getElementById('note').textContent =
      "「此原型故事源於榮格與神話學，作為當下之鏡」";
    stage.innerHTML = `<div class="arc-ring" id="arc"></div>`;
    const arc=document.getElementById('arc');
    const items=DATA.all||[];
    const n=items.length||12;
    const active=DATA.active||0;
    items.forEach((it,i)=>{
      const a=2*Math.PI*i/n-Math.PI/2;
      const x=50+45*Math.cos(a), y=50+45*Math.sin(a);
      const el=document.createElement('div');
      el.className='arc-item'+(i===active?' active':' inactive');
      el.style.left=x+'%'; el.style.top=y+'%';
      el.textContent=it.sym;
      el.title=it.name;
      el.style.animationDelay=(i*0.15)+'s';
      el.style.animation='planetIn .6s ease forwards';
      arc.appendChild(el);
    });
    const c=document.createElement('div');
    c.className='arc-center';
    c.innerHTML=`<div class="sym">${DATA.sym||''}</div>
      <div class="name">${DATA.name||''}</div>
      <div class="desc">${DATA.desc||''}</div>`;
    arc.appendChild(c);
  },

  /* ---------------- 夢 ---------------- */
  dream() {
    document.getElementById('note').textContent =
      "「此夢境回音源於佛教與意象療法，夢象轉譯為情緒註腳」";
    stage.innerHTML = `<div class="dream-stage" id="dream">
        <div class="dream-gradient"></div></div>
      <div class="dream-mood">${DATA.mood||''}</div>
      <div class="dream-note">${DATA.note||''}</div>`;
    const ds=stage.querySelector('.dream-stage');
    (DATA.images||[]).forEach((im,i)=>{
      const f=document.createElement('div');
      f.className='dream-frag';
      f.textContent=im.sym||im.text;
      f.style.left=(8+Math.random()*80)+'%';
      f.style.top=(20+Math.random()*55)+'%';
      f.style.color=im.color||'#8fc4d8';
      f.style.animationDelay=(i*0.7)+'s';
      f.style.animationDuration=(5+Math.random()*3)+'s';
      ds.appendChild(f);
    });
  }
};

if (R[MODE]) R[MODE]();
</script>
</body>
</html>
