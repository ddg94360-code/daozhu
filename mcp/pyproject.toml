[project]
name = "daozhu-mcp"
version = "1.0.0"
description = "道樞記憶層 MCP server——日用集、道藏、節氣與整庫備份"
requires-python = ">=3.10"
dependencies = [
    "mcp==1.28.1",
]
[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
dev = ["ruff>=0.9", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
