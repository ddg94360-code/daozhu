<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道樞</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="stars"></div>
  <div class="vignette"></div>
  <svg class="taiji-fish" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#111"/>
    <path d="M50 2a48 48 0 0 1 0 96 24 24 0 0 1 0-48 24 24 0 0 0 0-48Z" fill="#f2f2f2"/>
    <circle cx="50" cy="26" r="6" fill="#111"/>
    <circle cx="50" cy="74" r="6" fill="#f2f2f2"/>
  </svg>
  <header>
    <div class="title">道樞</div>
    <div id="solar" class="sub"></div>
    <div id="memory-dir" class="path"></div>
    <nav class="nav">
      <a href="/" aria-current="page">看板</a>
      <a href="/cabinet">內閣</a>
      <a href="/xinjing">心鏡</a>
      <select id="theme-select" aria-label="主題">
        <option value="daoist">道家</option>
        <option value="confucian">儒家</option>
        <option value="legalist">法家</option>
        <option value="strategist">縱橫</option>
        <option value="taiji">太極</option>
      </select>
    </nav>
    <div id="perception" class="perception"></div>
  </header>
  <main>
    <section id="week" class="card"></section>
    <section class="card">
      <h2>支出</h2>
      <div id="expense-summary"></div>
      <ul id="expense-list"></ul>
      <form id="expense-form">
        <input name="item" placeholder="項目" required>
        <input name="amount" type="number" step="0.01" min="0.01" placeholder="金額" required>
        <select name="category">
          <option value="">自動分類</option>
          <option>飲食</option><option>交通</option><option>娛樂</option><option>學習</option><option>其他</option>
        </select>
        <button type="submit">記入</button>
      </form>
      <p class="err" id="expense-err"></p>
      <a id="expense-csv" href="/api/expenses.csv">下載本月 CSV</a>
    </section>
    <section class="card">
      <h2>健康</h2>
      <ul id="health-list"></ul>
      <form id="health-form">
        <input name="sleep_hours" type="number" step="0.1" min="0" placeholder="睡眠時數">
        <input name="exercise" placeholder="運動">
        <input name="water" placeholder="飲水">
        <button type="submit">打卡</button>
      </form>
      <p class="err" id="health-err"></p>
    </section>
    <section class="card">
      <h2>提醒</h2>
      <ul id="reminder-list"></ul>
      <form id="reminder-form">
        <input name="content" placeholder="內容" required>
        <input name="datetime" type="datetime-local" required>
        <button type="submit">新增</button>
      </form>
      <p class="err" id="reminder-err"></p>
    </section>
    <section class="card">
      <h2>採買</h2>
      <ul id="shopping-open"></ul>
      <ul id="shopping-done"></ul>
      <form id="shopping-form">
        <input name="item" placeholder="要買的" required>
        <button type="submit">加入</button>
      </form>
      <p class="err" id="shopping-err"></p>
    </section>
    <section class="card">
      <h2>情緒</h2>
      <ul id="mood-list"></ul>
      <form id="mood-form">
        <input name="mood" placeholder="今天感覺…" required>
        <button type="submit">記下</button>
      </form>
      <p class="err" id="mood-err"></p>
      <p id="mood-care" class="care"></p>
    </section>
    <section class="card">
      <h2>筆記</h2>
      <ul id="notes-due"></ul>
      <ul id="notes-recent"></ul>
      <form id="note-form">
        <input name="subject" placeholder="科目" required>
        <input name="content" placeholder="內容" required>
        <input name="review_days" type="number" min="0" step="1" value="7" placeholder="複習天數">
        <button type="submit">記入</button>
      </form>
      <p class="err" id="note-err"></p>
      <p class="hint">舊筆記沒有 id 時，請在對話裡複習或刪。</p>
    </section>
    <section class="card">
      <h2>決策</h2>
      <ul id="decision-list"></ul>
      <form id="decision-form">
        <input name="topic" placeholder="題目" required>
        <input name="verdict" placeholder="裁決" required>
        <input name="reason" placeholder="理由（可空）">
        <button type="submit">記下</button>
      </form>
      <p class="err" id="decision-err"></p>
    </section>
    <section class="card">
      <h2>道藏</h2>
      <div id="daozang"></div>
      <p class="hint">只讀。寫入請在對話用／藏。</p>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
