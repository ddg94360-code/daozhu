<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道樞 · 內閣</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="stars"></div>
  <div class="vignette"></div>
  <svg class="taiji-fish" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#111"/>
    <path d="M50 2a48 48 0 0 1 0 96 24 24 0 0 1 0-48 24 24 0 0 0 0-48Z" fill="#f2f2f2"/>
    <circle cx="50" cy="26" r="6" fill="#111"/>
    <circle cx="50" cy="74" r="6" fill="#f2f2f2"/>
  </svg>
  <aside id="rail" class="rail">
    <div class="rail-brand">道樞</div>
    <a href="/" data-short="看">看板</a>
    <a href="/cabinet" aria-current="page" data-short="閣">內閣</a>
    <a href="/xinjing" data-short="鏡">心鏡</a>
    <select id="theme-select" aria-label="主題">
      <option value="daoist">道家</option>
      <option value="confucian">儒家</option>
      <option value="legalist">法家</option>
      <option value="strategist">縱橫</option>
      <option value="taiji">太極</option>
    </select>
    <div id="rail-status" class="rail-status">
      <div>127.0.0.1:8765</div>
      <div>記憶庫 · 本機</div>
    </div>
  </aside>
  <div class="shell">
  <header>
    <div class="title">內閣</div>
    <p class="sub">填議題後開會。五階段佔主欄；未開時先排出席。</p>
  </header>
  <div class="workspace">
    <div class="compose" id="cabinet-compose">
    <section class="card">
      <h2>議題</h2>
      <form id="cabinet-form">
        <textarea name="topic" placeholder="組員不做事該怎麼講" required></textarea>
        <select id="cabinet-depth" name="depth" aria-label="會議深度">
          <option value="brief">精簡</option>
          <option value="deep">深度</option>
          <option value="flash">即時共識</option>
        </select>
        <button type="submit">排出席</button>
        <button type="button" id="cabinet-convene">開會</button>
        <label><input type="checkbox" id="cabinet-persist"> 記入「會議已開」</label>
      </form>
      <p class="err" id="cabinet-err"></p>
      <p class="hint" id="cabinet-disc"></p>
    </section>
    <section class="card">
      <h2>追問</h2>
      <form id="cabinet-followup-form">
        <select id="cabinet-followup-name" aria-label="內閣">
          <option>儒家</option>
          <option>道家</option>
          <option>法家</option>
          <option>縱橫家</option>
          <option>兵家</option>
          <option>墨家</option>
          <option>佛教</option>
        </select>
        <input id="cabinet-followup-q" name="question" placeholder="先說哪一句" required>
        <button type="submit">追問</button>
      </form>
      <p class="err" id="cabinet-followup-err"></p>
      <div id="cabinet-followup" class="stage-card card" hidden></div>
    </section>
    <section class="card">
      <h2>出席</h2>
      <p id="cabinet-rule"></p>
      <p id="cabinet-chair"></p>
      <ul id="cabinet-core"></ul>
      <ul id="cabinet-adjunct"></ul>
    </section>
    </div>
    <section class="card stage-pane" id="cabinet-stage-pane">
      <div id="cabinet-stages">
        <h2>五階段</h2>
        <p class="hint">尚未開會。左側填議題，按「開會」後發言會出現在這裡。</p>
      </div>
    </section>
  </div>
  </div>
  <script src="/static/cabinet.js"></script>
</body>
</html>
