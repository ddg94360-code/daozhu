<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>道樞 · 心鏡</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="stars"></div>
  <div class="vignette"></div>
  <svg class="taiji-fish" viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="48" fill="#111"/>
    <path d="M50 2a48 48 0 0 1 0 96 24 24 0 0 1 0-48 24 24 0 0 0 0-48Z" fill="#f2f2f2"/>
    <circle cx="50" cy="26" r="6" fill="#111"/>
    <circle cx="50" cy="74" r="6" fill="#f2f2f2"/>
  </svg>
  <aside id="rail" class="rail">
    <div class="rail-brand">道樞</div>
    <a href="/" data-short="看">看板</a>
    <a href="/cabinet" data-short="閣">內閣</a>
    <a href="/xinjing" aria-current="page" data-short="鏡">心鏡</a>
    <select id="theme-select" aria-label="主題">
      <option value="daoist">道家</option>
      <option value="confucian">儒家</option>
      <option value="legalist">法家</option>
      <option value="strategist">縱橫</option>
      <option value="taiji">太極</option>
    </select>
    <div id="rail-status" class="rail-status">
      <div>127.0.0.1:8765</div>
      <div>記憶庫 · 本機</div>
    </div>
  </aside>
  <div class="shell">
  <header>
    <div class="title">心鏡</div>
    <p class="sub">示範可播；真算需接天機。舞台佔主欄。</p>
  </header>
  <div class="workspace">
    <div class="compose" id="xinjing-compose">
    <section class="card">
      <h2>萬象心鏡</h2>
      <p class="hint" id="xinjing-hint">示範仍可用；真算需 DAOZHU_TIANJI_DIR。</p>
      <p class="hint" id="xinjing-status"></p>
      <form id="xinjing-form">
        <select name="mode" id="xinjing-mode">
          <option>tarot</option>
          <option>gua</option>
          <option>fengshui</option>
          <option>chart</option>
          <option>bazi</option>
          <option>ziwei</option>
          <option>meihua</option>
          <option>qimen</option>
          <option>qizheng</option>
          <option>xingming</option>
          <option>numerology</option>
          <option>lenormand</option>
          <option>fusion</option>
          <option>yuan</option>
          <option>star</option>
          <option>dream</option>
        </select>
        <button type="button" id="xinjing-example">載入示範</button>
        <button type="button" id="xinjing-cast">真抽／真起</button>
        <button type="submit">播放</button>
        <textarea name="data" id="xinjing-data" placeholder='{"source":"…"}'></textarea>
      </form>
      <p class="err" id="xinjing-err"></p>
    </section>
    </div>
    <iframe id="xinjing-stage" class="stage-pane" title="心鏡舞台" sandbox="allow-scripts"></iframe>
  </div>
  </div>
  <script src="/static/xinjing.js"></script>
</body>
</html>
